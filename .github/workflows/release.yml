name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release: build + push the runtime image
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # prerelease: same (image only)
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing via GitHub OIDC
    steps:
      # Actions pinned to commit SHAs (never @vN — tags are mutable), matching ci.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # debian-based image with apt: arm64 needs emulation (not a COPY-only build).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push multi-arch runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/runtime.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        # Pin the cosign binary to a fixed release, not the installer's moving default,
        # so the signing tool is reproducible. Residual trust: the installer fetches this
        # binary from the sigstore/cosign GitHub release and verifies it against the
        # action's embedded release metadata — we trust that GitHub-hosted artifact and
        # the action's integrity check; no independent out-of-band checksum is pinned here.
        # Must stay on cosign 2.x: 3.x dropped the detached cosign-linux-amd64.sig asset
        # this installer verifies against, so a 3.x pin 404s the sig download (exit 22).
        with:
          cosign-release: 'v2.6.4'
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # cordon#4 — the runtime image is NOT the sandbox. It is the swappable `<runtime>`
  # argument: a generic debian + toolchain image with no isolation properties of its own.
  # Every guarantee cordon makes (`--network none`, `--cap-drop ALL`, `--read-only`,
  # non-root uid, the pid/memory/cpu ceilings, the wall-clock reaper) lives in
  # `bin/cordon-run.sh`, which shipped in no artifact at all — reachable only by cloning.
  #
  # The script cannot sensibly be baked into the image and run as its entrypoint: it is
  # the thing that *invokes* `docker run`, so putting it inside the container it launches
  # would require docker-in-docker. It ships as a release asset instead.
  sandbox:
    name: sandbox-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # attach the sandbox script to the GitHub Release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Stage the sandbox artifact
        # A verbatim copy, deliberately: `tests/test_cordon_run_script.py` audits
        # `bin/cordon-run.sh`, and that audit only means something if the audited file is
        # byte-for-byte the file consumers download. Nothing here templates or rewrites it.
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bin/cordon-run.sh dist/cordon-run.sh
          chmod 0755 dist/cordon-run.sh
          cd dist && sha256sum cordon-run.sh > cordon-run.sh.sha256
          cat cordon-run.sh.sha256
      - name: Publish to the GitHub Release
        # `gh` is preinstalled on the runner and authenticates with GITHUB_TOKEN, so this
        # adds no third-party action to the supply chain of the component whose entire
        # job is containment.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes $prerelease
          fi
          gh release upload "$TAG" \
            dist/cordon-run.sh \
            dist/cordon-run.sh.sha256 \
            --clobber
